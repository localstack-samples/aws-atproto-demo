name: Deploy on LocalStack

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: infra-${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack:
          - poller
          - fargate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk and the CDK CLI
        run: |
          npm install -g @localstack/lstk aws-cdk
          lstk setup aws --force --non-interactive

      - name: Install dependencies
        run: |
          for dir in firehose-mock lambdas ingest-${{ matrix.stack == 'poller' && 'poller' || 'consumer' }} infra-${{ matrix.stack }}; do
            (cd "$dir" && npm ci)
          done

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          LOCALSTACK_ECR_ENDPOINT_STRATEGY: 'off'
        run: lstk start

      # Docker Engine on Linux has no host.docker.internal, so point the
      # Lambda and ECS containers at the Docker bridge gateway for the mock
      # firehose, and the ECS consumer at LocalStack through its DNS name.
      - name: Deploy infra-${{ matrix.stack }}
        working-directory: infra-${{ matrix.stack }}
        run: |
          gateway=$(docker network inspect bridge --format '{{ (index .IPAM.Config 0).Gateway }}')
          export FIREHOSE_URL="ws://$gateway:8080"
          export AWS_ENDPOINT_URL_FOR_CONSUMER=http://localhost.localstack.cloud:4566
          lstk cdk bootstrap
          lstk cdk deploy --require-approval never

      - name: Run tests
        run: ./test.sh ${{ matrix.stack }}

      - name: Show service logs
        if: failure()
        run: |
          if [ "${{ matrix.stack }}" = "poller" ]; then
            lstk aws logs tail /aws/lambda/atproto-ingest-poller || true
          else
            lstk aws logs tail /atproto-demo/ingest-consumer || true
          fi
          lstk logs | tail -300
